<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ציר זמן</title><style>
:root{--bg:#fffbfe;--surface:#fff;--soft:#f7f2fa;--text:#1d1b20;--muted:#666;--primary:#6750a4;--outline:#cac4d0}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:auto;background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit}.app{max-width:1180px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.top h1{margin:0;font-size:30px}.muted{color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--outline);background:var(--surface);padding:9px 13px;border-radius:12px;cursor:pointer}.primary{background:var(--primary);color:#fff;border-color:var(--primary)}button:disabled{opacity:.45;cursor:not-allowed}.continue{margin:18px 0;background:linear-gradient(135deg,var(--surface),var(--soft));border:1px solid var(--outline);border-radius:20px;padding:18px;display:flex;align-items:center;justify-content:space-between;gap:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:var(--surface);border:1px solid var(--outline);border-radius:16px;padding:14px}.stat b{font-size:23px;display:block}.toolbar{display:grid;grid-template-columns:1fr auto auto;gap:8px;margin:14px 0}.toolbar input,.toolbar select{background:var(--surface);border:1px solid var(--outline);border-radius:12px;padding:10px}.panel{background:var(--surface);border:1px solid var(--outline);border-radius:18px;padding:14px;margin:14px 0}.heatmap{display:grid;grid-template-columns:repeat(35,1fr);gap:4px}.heat{aspect-ratio:1;border-radius:4px;background:var(--soft);border:1px solid var(--outline)}.h1{background:color-mix(in srgb,var(--primary) 25%,var(--soft))}.h2{background:color-mix(in srgb,var(--primary) 45%,var(--soft))}.h3{background:color-mix(in srgb,var(--primary) 70%,var(--soft))}.h4{background:var(--primary)}.searches{display:flex;gap:6px;flex-wrap:wrap}.searchChip{border-radius:999px;padding:6px 10px}.session{background:var(--surface);border:1px solid var(--outline);border-radius:20px;padding:16px;margin:14px 0}.sessionHead{display:flex;justify-content:space-between;gap:12px;align-items:start}.session h2{font-size:17px;margin:0 0 4px}.books{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.books span{background:var(--soft);padding:5px 9px;border-radius:999px;font-size:13px}.events{border-top:1px solid var(--outline)}.event{display:flex;justify-content:space-between;gap:10px;padding:10px 4px;border-bottom:1px solid color-mix(in srgb,var(--outline) 65%,transparent);cursor:pointer}.event small{display:block;color:var(--muted);margin-top:3px}.event time{color:var(--muted);white-space:nowrap}.empty{text-align:center;padding:50px;color:var(--muted)}.dialog{display:none;position:fixed;inset:0;background:#0006;align-items:center;justify-content:center;padding:20px}.dialog.open{display:flex}.dialogBox{background:var(--surface);border-radius:20px;padding:20px;width:min(480px,100%)}.dialogBox select{width:100%;padding:10px;border:1px solid var(--outline);border-radius:10px;background:var(--surface)}@media(max-width:720px){.app{padding:12px}.stats{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.heatmap{grid-template-columns:repeat(7,1fr)}.sessionHead,.continue{align-items:stretch;flex-direction:column}}
</style></head><body><div class="app"><div class="top"><div><h1>ציר זמן</h1><div class="muted">היסטוריית העבודה שלך באוצריא — מקומית בלבד</div></div><div class="actions"><button id="snapshotBtn">שמור Snapshot עכשיו</button><button id="pauseBtn"></button><button id="settingsBtn">הגדרות</button><button id="clearBtn">נקה</button></div></div>
<div class="continue"><div><b>המשך מהמקום שבו הפסקת</b><div id="continueInfo" class="muted"></div></div><button id="continueBtn" class="primary">המשך עבודה</button></div>
<div class="stats"><div class="stat"><b id="count">0</b><span>אירועים</span></div><div class="stat"><b id="sessionCount">0</b><span>סשנים</span></div><div class="stat"><b id="bookCount">0</b><span>ספרים</span></div><div class="stat"><b id="dayCount">0</b><span>ימים פעילים</span></div></div>
<div class="panel"><b>35 הימים האחרונים</b><div id="heatmap" class="heatmap" style="margin-top:10px"></div></div><div class="panel"><b>חיפושים אחרונים</b><div id="recentSearches" class="searches" style="margin-top:10px"></div></div>
<div class="toolbar"><input id="search" placeholder="חיפוש בציר הזמן…"><select id="type"><option value="">כל הפעילויות</option><option value="book">פתיחת ספר</option><option value="ref">קריאה/מיקום</option><option value="workspace">שולחן עבודה</option><option value="navigation">ניווט</option></select><select id="range"><option value="7">7 ימים</option><option value="30" selected>30 ימים</option><option value="90">90 ימים</option><option value="0">הכול</option></select></div><main id="content"></main></div>
<div id="dialog" class="dialog"><div class="dialogBox"><h2>הגדרות</h2><label>מספר אירועים מרבי</label><select id="maxEvents"><option>1000</option><option>2500</option><option selected>5000</option><option>10000</option><option>20000</option></select><div class="actions" style="margin-top:16px"><button id="saveSettings" class="primary">שמור</button><button id="closeSettings">ביטול</button></div></div></div><script src="app.js"></script></body></html>
