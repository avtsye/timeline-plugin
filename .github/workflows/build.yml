name: Build Otzaria Timeline
permissions:
  contents: write
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: timeline-build-main
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Official Otzaria plugin validator (strict)
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: .
          app-version: '0.9.97'
          fail-on-warnings: 'true'
          publish: 'false'

      - name: Validate manifest JSON
        run: node -e "const m=JSON.parse(require('fs').readFileSync('manifest.json','utf8')); if(m.minAppVersion!=='0.9.97') throw new Error('minAppVersion must stay 0.9.97'); console.log('manifest OK, Otzaria >= 0.9.97')"

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check background.js
          node --check official-fluent-icons.js
          node --check tests/runtime-smoke.js

      - name: Runtime smoke
        run: node tests/runtime-smoke.js

      - name: CSS architecture audit
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          const css=(html.match(/<style>([\s\S]*?)<\/style>/)||[])[1]||'';
          const forbidden=[
            '0.15.7 simplified settings',
            '0.15.8 sidebar-bottom settings',
            '0.15.9 comprehensive UX pass',
            '0.15.10 settings overlap hardening',
            '0.15.11 settings alignment + clipping fix',
            '0.15.12 settings right-cluster + footer containment',
            '0.15.13 definitive settings layout',
            '0.15.14 settings: restore right navigation + table layout',
            '0.15.15 Otzaria-style settings sidebar',
            '0.15.16 compact settings rows',
            '0.15.17 truly compact settings controls',
            '0.15.18 compact inline toggle rows'
          ];
          const returned=forbidden.filter(x=>css.includes(x));
          if(returned.length) throw new Error('Legacy settings CSS returned: '+returned.join(', '));
          if(!css.includes('0.16.0 canonical Otzaria UI')) throw new Error('Canonical Otzaria UI block missing');
          const important=(css.match(/!important/g)||[]).length;
          if(important>150) throw new Error('CSS !important budget exceeded: '+important);
          const settingsLayout=(css.match(/#settingsScreen\.settings-pane\.screen\.active\s*\{/g)||[]).length;
          if(settingsLayout<1||settingsLayout>2) throw new Error('Unexpected settings root layout definition count: '+settingsLayout);
          console.log('CSS architecture OK: '+important+' !important declarations');
          NODE

      - name: Check 0.9.97 API compatibility
        run: |
          node <<'NODE'
          const fs=require('fs');
          const source=['app.js','background.js','index.html'].map(f=>fs.readFileSync(f,'utf8')).join('\n');
          const api098=[
            'library.getBookDetails',
            'library.setProviderBooks',
            'tools.biographies',
            'fs.deleteFolder',
            'fs.moveEntry',
            'fs.pickUserFolder',
            'fs.listUserFolder',
            'fs.openFolderFile',
            'fs.revokeFolder'
          ];
          const used=api098.filter(x=>source.includes(x));
          if(used.length) throw new Error('0.9.98-only APIs detected: '+used.join(', '));
          console.log('No known 0.9.98-only API calls detected');
          NODE

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('manifest.json','utf8')).version)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build otzplugin package
        shell: bash
        run: |
          mkdir -p dist
          FILE="timeline-plugin-${{ steps.version.outputs.version }}.otzplugin"
          rm -f "dist/$FILE"
          zip -9 -j "dist/$FILE" manifest.json index.html app.js background.html background.js official-fluent-icons.js README.md
          unzip -t "dist/$FILE"
          echo "Built dist/$FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: timeline-plugin-${{ steps.version.outputs.version }}
          path: dist/*.otzplugin
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="v$VERSION"
          TITLE="Timeline $VERSION"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" --generate-notes
          fi
          gh release upload "$TAG" dist/*.otzplugin --clobber
